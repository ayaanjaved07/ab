[settings]

# window_title = Asphalt - v50.0.6a - D3D12

# number of times the hunt will run
number = 20

# options are pur, nino
car = pur

# watch ads for bonus coins
watch_ad = True 
  
# plays till all tickets and refills are used and exits the program, set play_infinitely to True if you want it to sleep for 1 hour then continue
ticket_refill = False

# ticket refill is given priority if both are enabled
token_refill = False 

# watch ads for ticket refills
ad_ticket_refill = False

# plays till all tickets are used, then sleeps for 1 hour and continues
play_infinitely = True
# time to sleep(in minutes) when play_infinitely is True, and all tickets are used
play_infinitely_sleep = 125

# route signs taken in priority
# 1-> barrel > yellow bottle > blue bottle > flat ramp
# 2-> yellow bottle > blue bottle 
route = 1
route_config = True
route_set = coin, bottle2, bottle1

# time to sleep(in seconds) when switching cars, allows the car to fully load before starting detection
car_switch_sleep = 0.3
# time to sleep between actions(in seconds), all sleep times are a multiple of this, not recommended to lower it, you can increase it if your pc is slow
sleep = 1